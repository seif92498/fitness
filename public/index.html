function barChart(values,labels,{target=null,unit='',color='accent',scale=0}={}){
 const topValue=Math.max(scale||1,target||0,...values.map(v=>v||0));
 const power=10**Math.floor(Math.log10(topValue/3));
 const step=power*([1,2,2.5,3,4,5,7.5,10].find(c=>c*power>=topValue/3)||10),max=3*step;
 const xs=values.map((_,i)=>450-i*(408/Math.max(values.length-1,1)));const y0=107, top=12;
 const ty=v=>y0-clamp(v/max,0,1)*(y0-top);
 let grid='';for(const ticks of [3,2,1,0]){const y=ty(ticks*step);grid+=`<path class="${ticks?'chart-grid':'chart-axis'}" d="M20 ${y}H478"/><text class="axis-number" x="521" y="${y+4}" text-anchor="end">${nfmt(ticks*step,step<1?2:step<10?1:0)}</text>`;}
 if(target!==null)grid+=`<path class="chart-target" d="M20 ${ty(target)}H483"><title>الهدف: ${nfmt(target,1)} ${esc(unit)}</title></path>`;
 return `<svg class="chart-svg" viewBox="0 0 525 133" role="img" aria-label="رسم بياني ${esc(unit)}" style="--paint:var(--${color})">${grid}${values.map((v,i)=>{const x=xs[i];const y=ty(v||0);const bh=Math.max(v==null?0:2,y0-y);return `<rect class="chart-bar ${i===values.length-1?'current':''}" x="${x-13}" y="${y0-bh}" width="26" height="${bh}" rx="4"><title>${esc(labels[i])}: ${v==null?'مش متسجّل':`${nfmt(v,1)} ${esc(unit)}`}</title></rect><text x="${x}" y="126" text-anchor="middle">${esc(labels[i])}</text>`;}).join('')}</svg>`;
}
function sparkline(values,tone){const vs=values.map(v=>v||0);const lo=Math.min(...vs),hi=Math.max(...vs);const coords=vs.map((v,i)=>[3+i*13,30-(v-lo)*24/(hi-lo||1)]);const last=coords.at(-1);return `<svg class="spark" viewBox="0 0 88 34" aria-hidden="true"><path d="${coords.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ')} L${last[0]} 34 H3Z" fill="var(--${tone}-soft)"/><path d="${coords.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ')}" fill="none" stroke="var(--${tone})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--${tone})"/></svg>`;}

 const rows=[['التاريخ','النوع','الاسم','الوجبة','الجرام','السعرات','بروتين (جم)','كارب (جم)','دهون (جم)','الوزن (كجم)','تكرارات أو مدة','مجموعات','صعوبة']];

const spokenQuant={'واحد':1,'واحده':1,'اتنين':2,'اثنين':2,'اثنتين':2,'تلاته':3,'تلات':3,'ثلاثه':3,'ثلاث':3,'اربعه':4,'اربع':4,'خمسه':5,'خمس':5,'نص':.5,'نصف':.5,'ربع':.25,'ميه':100,'مئه':100};
const measureUnits={'جرام':1,'غرام':1,'جرامات':1,'جم':1,'غ':1,'g':1,'كيلو':1000,'كجم':1000,'kg':1000,'مل':1,'ملي':1};
function parseFoodText(input){
 const seq=words(normalize(input).replace(/(\d)(?=\p{L})/gu,'$1 '));const foods=allFoods();const special={بيضتين:2,رغيف:1,رغيفين:2,موزتين:2,كوبايتين:2,تفاحتين:2};
 const aliases=[];for(const food of foods){for(const term of new Set([food.name,...food.aliases,...(food.id==='apple'?['تفاحتين']:[])])){const tokens=words(term);if(tokens.length)aliases.push({food,tokens});}}
 aliases.sort((a,b)=>b.tokens.length-a.tokens.length||b.tokens.join('').length-a.tokens.join('').length);
 const numToken=t=>Object.hasOwn(spokenQuant,t)?spokenQuant[t]:/^\d+(\.\d+)?$/.test(t||'')?Number(t):null;
 const unitValue=t=>own(measureUnits,t)?measureUnits[t]:0;
 const rows=[];let pending=null,unit=0;
 for(let i=0;i<seq.length&&rows.length<12;i++){
   const token=seq[i];let first=token;let q=numToken(token);
   if(q==null&&token.startsWith('و')){const x=numToken(token.slice(1));if(x!=null)q=x;}
   if(q!=null){pending=q;unit=unitValue(seq[i+1]);if(unit)i++;continue;}
   if(token==='و'||token==='مع'||token==='زائد'){pending=null;unit=0;continue;}
   let match=aliases.find(a=>a.tokens.every((t,j)=>seq[i+j]===t));
   if(!match&&token.startsWith('و')&&token.length>2){first=token.slice(1);match=aliases.find(a=>a.tokens[0]===first&&a.tokens.slice(1).every((t,j)=>seq[i+j+1]===t));}
   if(!match)continue;
   const {food,tokens}=match;i+=tokens.length-1;
   if(own(special,first)){
     const repeatedName=aliases.find(a=>a.food.id===food.id&&a.tokens.every((t,j)=>seq[i+1+j]===t));
     if(repeatedName)i+=repeatedName.tokens.length;
   }
   const post=numToken(seq[i+1]),postUnit=unitValue(seq[i+2]);
   if(pending==null&&post!=null&&postUnit){pending=post;unit=postUnit;i+=2;}
   const grams=rounded(clamp(pending!=null?(unit?pending*unit:pending*food.portion):(special[first]||1)*food.portion,1,5000));
   rows.push({food,grams});pending=null;unit=0;
 }
 return rows;
}

async function localDictate(){
 const Engine=window.SpeechRecognition||window.webkitSpeechRecognition;
 try{
  if(!Engine||!Engine.available||!('processLocally' in new Engine()))throw Error();
  const result=await Engine.available({langs:['ar-EG'],processLocally:true});if(result!=='available')throw Error();
  const sr=new Engine();sr.processLocally=true;sr.lang='ar-EG';sr.maxAlternatives=1;
  sr.onresult=e=>{const node=$('#natural-input');if(node){node.value=[node.value,e.results[0][0].transcript].filter(Boolean).join(' ').slice(0,500);}};
  sr.onerror=()=>toast('مقدرناش نسمعك. جرّب تكتب الكلام.',true);sr.start();toast('اتكلم دلوقتي');
 }catch{toast('الإملاء العربي على الجهاز مش متاح في المتصفح ده. ممكن تستخدم الكيبورد.',true);}
}

function fridgeResults(input){const result=$('#fridge-result');if(!result)return;const knownIds=new Set(parseFoodText(input).map(({food})=>food.id));const typed=normalize(input);
 for(const f of FOODS){if([f.name,...f.aliases].some(a=>normalize(a).length>=2&&` ${typed} `.includes(` ${normalize(a)} `)))knownIds.add(f.id);}
 const t=energy(),eaten=sum(getDay().food);const spend=t?Math.max(100,Math.min(850,t.kcal-eaten.kcal)):480,pNeed=t?Math.max(0,t.p-eaten.p):25;
 const options=Object.values(MEAL_PLAN).flat().filter(([,items])=>items.every(([k])=>!excludedFood(getFood(k)))).map(([name,items])=>{

async function encodePhoto(file,max=960,quality=.72){
 if(!file||file.size>15*1024*1024)throw Error('اختار صورة أصغر من 15 ميجابايت.');
 const url=URL.createObjectURL(file);
 try{
   const img=new Image();img.src=url;
   if(img.decode)await img.decode().catch(()=>{throw Error('صيغة الصورة مش مدعومة هنا. جرّب JPG أو PNG.');});
   else await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('الصورة مش مفهومة.'));});
   const canvas=document.createElement('canvas');const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('معرفناش نعالج الصورة هنا.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   return canvas.toDataURL('image/jpeg',quality);
 }finally{URL.revokeObjectURL(url);}
}
function parseEstimate(answer){

 let d;try{d=JSON.parse(slice);}catch{throw Error('مقدرناش نميّز الأكلة من الصورة. جرّب صورة أوضح.');}
 if(!isObj(d)||!txt(d.name,75)||!Number.isFinite(Number(d.grams))||+d.grams<=0||!['kcal','p','c','f'].every(k=>d[k]!==null&&d[k]!==''&&Number.isFinite(Number(d[k]))&&+d[k]>=0))throw Error('النتيجة ناقصة. سجّل الوجبة يدوي لو الأرقام مش واضحة.');
 return {name:txt(d.name,75),grams:rounded(bound(d.grams,1,5000)),kcal:rounded(bound(d.kcal,0,5000),1),p:rounded(bound(d.p,0,500),1),c:rounded(bound(d.c,0,1000),1),f:rounded(bound(d.f,0,500),1)};
}

const planSlots=['breakfast','snack','lunch','dinner'];
const mealShares={breakfast:.27,snack:.15,lunch:.34,dinner:.24};
function planAvailable(slot){return MEAL_PLAN[slot].map(([label,ingredients],idx)=>({label,ingredients,idx})).filter(x=>x.ingredients.every(([k])=>!excludedFood(getFood(k))));}
function scaledPortion(ingredients,cals){
 const base=sum(ingredients.map(([id,g])=>kcalOf(getFood(id),g))).kcal;
 if(base<=0)return [];
 const factor=cals/base;
 const scaled=ingredients.map(([k,g])=>[getFood(k),Math.max(1,rounded(g*factor))]);
 let err=cals-sum(scaled.map(([f,g])=>kcalOf(f,g))).kcal;
 let best=null;for(const [i,[f,g]] of scaled.entries()){const step=rounded(err/(f.kcal/100));if(g+step<1)continue;const diff=Math.abs(err-step*f.kcal/100);if(diff<Math.abs(err)&&(!best||diff<best.diff))best={i,step,diff};}if(best)scaled[best.i][1]+=best.step;
 return scaled.map(([food,grams])=>({food,grams,...kcalOf(food,grams)}));
}
function diet(day,target){return planSlots.map((slot,i)=>{
 const options=planAvailable(slot);const fallback=(day+i)%MEAL_PLAN[slot].length;
 const choice=options.find(x=>x.idx===(state.planChoices[day+'-'+slot]??fallback))||options[0];
 const rows=choice?scaledPortion(choice.ingredients,target*mealShares[slot]):[];
 return {slot,options,choice,rows,total:sum(rows)};
});}
function shoppingMarkup(target){
 const basket={};for(let day=0;day<7;day++)for(const meal of diet(day,target))for(const x of meal.rows)basket[x.food.id]=(basket[x.food.id]||0)+x.grams;
 const items=Object.entries(basket).sort((a,b)=>b[1]-a[1]);
 return items.length?`<div class="shopping-list">${items.map(([k,g])=>`<div class="list-entry"><span>${userText(getFood(k).name)}</span><strong>${g>=1000?`${nf(g/1000,2)} كجم`:`${nf(g)} جم`}</strong></div>`).join('')}</div>`:empty('مفيش مكوّنات متاحة','راجع الأصناف اللي بتبعد عنها في حسابي.','bag');
}

function lineChart(points,unit){
 if(!points.length)return empty('لسه مفيش بيانات','أول تسجيل هيظهر هنا، وبعده تقدر تشوف الاتجاه.','chart');
 const marks=points.slice(-18),first=marks[0],last=marks.at(-1),width=525,y0=122,yt=14;
 const min=Math.min(...marks.map(d=>d.value)),max=Math.max(...marks.map(d=>d.value)),pad=Math.max(.4,(max-min)*.13,min===max?max*.02:0),hi=max+pad,lo=Math.max(0,min-pad);
 const length=first.date===last.date?0:gapDays(last.date,first.date);
 const coords=marks.map(d=>({x:length?33+gapDays(last.date,d.date)*431/length:249,y:y0-(d.value-lo)/(hi-lo)*(y0-yt),...d}));
 const path=coords.map((d,i)=>`${i?'L':'M'}${d.x} ${d.y}`).join(' ');
 let grids='';for(const f of [0,.5,1]){const y=yt+(y0-yt)*f;grids+=`<path class="chart-grid" d="M20 ${y}H477"/><text class="axis-number" x="522" y="${y+4}" text-anchor="end">${nfmt(hi-(hi-lo)*f,1)}</text>`;}
 const corner=length?`<text x="453" y="147" text-anchor="end">${esc(shortDate(first.date))}</text><text x="34" y="147" text-anchor="start">${esc(shortDate(last.date))}</text>`:`<text x="249" y="147" text-anchor="middle">${esc(shortDate(first.date))}</text>`;
 return `<svg class="chart-svg" viewBox="0 0 ${width} 155" role="img" aria-label="التغيّر في ${esc(unit)} مع الوقت">${grids}${coords.length>1?`<path d="${path}V${y0}H${coords[0].x}Z" fill="var(--accent-soft)" opacity=".72"/><path class="chart-stroke" d="${path}"/>`:''}${coords.map(m=>`<circle class="chart-dot" r="4.4" cx="${m.x}" cy="${m.y}"><title>${esc(shortDate(m.date))}: ${nfmt(m.value,2)} ${esc(unit)}</title></circle>`).join('')}${corner}</svg>`;
}

function reviewSummary(r){
 const w=weekly(r?.date||today()),t=energy(),tr=weightTrend(24),p=state.profile;const good=[],improve=[];
 if(w.logged>=5)good.push(`سجّلت ${w.logged} من 7 أيام. ده أساس كويس للاستمرار.`);

 if(w.sleep!=null){if(w.sleep>=7)good.push(`متوسط النوم المسجّل ${nfmt(w.sleep,1)} ساعة.`);else improve.push(`متوسط النوم ${nfmt(w.sleep,1)} ساعة. حاول تثبّت وقت النوم والصحيان.`);}else improve.push('سجّل النوم كام يوم عشان نقدر نشوف اتجاه.');
 if(t&&w.water!=null){if(w.water>=.9*t.water)good.push('متوسط الماية قريب من الهدف في الأيام المتسجّلة.');else improve.push(`الماية حوالي ${nfmt(w.water/1000,1)} لتر في الأيام المتسجّلة مقابل ${nfmt(t.water/1000,1)} لتر. جرّب توزّعها على اليوم.`);}
 if(p&&w.work>=Math.max(1,p.trainDays-1))good.push(`في ${w.work} أيام تمرين من أصل ${p.trainDays} مستهدفين.`);else if(p)improve.push(`التمرين متسجّل ${w.work} أيام. لو الجدول تقيل ابدأ بعدد أيام تقدر تثبّته.`);
 if(tr&&p){const rate=Math.abs(tr.week/p.weight);if(rate>.01)improve.push(`الوزن بيتغير بسرعة في القياسات (حوالي ${nfmt(Math.abs(tr.week),1)} كجم/أسبوع). أعد القياس في ظروف ثابتة، ولو التغيّر غير مقصود راجع دكتور.`);else if(p.goal==='bulk'&&plateau())improve.push('الوزن شبه ثابت حوالي 3 أسابيع. اتأكد من متوسط الأكل والميزان قبل تغيير السعرات؛ راجع أخصائي لو محتاج.');else good.push(`متوسط تغيّر الوزن من القياسات حوالي ${tr.week>=0?'+':'−'}${nfmt(Math.abs(tr.week),2)} كجم أسبوعيًا؛ التذبذب طبيعي.`);}
 if(r){if(r.energy==='low')improve.push('لو الإرهاق مستمر أو شديد رغم الراحة والأكل، اتكلم مع دكتور.');if(r.commit==='low')improve.push('خفّف الخطة لحاجات بسيطة: يومين ثابتين وسجل وجبة واحدة كبداية.');if(r.sleep==='poor')improve.push('جودة النوم متقطّعة. جرّب تقلّل كافيين متأخر، ولو مستمرة راجع مختص.');if(r.pain==='mild')improve.unshift('وقّف الحركة اللي بتوجعك، ولو الألم مستمر راجع مختص قبل الرجوع.');if(r.pain==='severe')improve.unshift('وقّف التمرين اللي بيسبب الألم الشديد وراجع دكتور. لو في إصابة حادة أو أعراض طارئة اطلب رعاية عاجلة.');}

async function askAI(payload){
 if(!supportedServer()||navigator.onLine===false)throw Error('التحليل الخارجي مش متاح في النسخة الثابتة أو من غير نت. جرّب الأدوات المحلية.');
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),37000);
 try{
  const response=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,consent:true}),signal:controller.signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
  if(response.status===429)throw Error('التحليل اتطلب كتير دلوقتي. جرّب كمان شوية.');
  if(response.status===401||response.status===403)throw Error('مزوّد التحليل مش سامح بالطلب دلوقتي.');
  if(response.status===503||response.status===404||response.status===405||!response.headers.get('content-type')?.includes('application/json'))throw Error('التحليل بالذكاء الاصطناعي مش مفعّل على الاستضافة دي. باقي الأدوات شغّالة عادي.');
  if(!response.ok)throw Error('مقدرناش نكمّل التحليل. جرّب تاني أو استخدم المراجعة المحلية.');
  let data;try{data=await response.json();}catch{throw Error('النتيجة ماوصلتش كاملة. جرّب تاني.');}if(typeof data.answer!=='string'||!data.answer.trim())throw Error('النتيجة فاضية. جرّب تاني.');return data.answer.trim();
 }catch(e){if(e?.name==='AbortError')throw Error('التحليل أخد وقت أطول من المتوقع. جرّب تاني.');if(e instanceof TypeError)throw Error('الاتصال مش متاح دلوقتي. راجع النت وجرّب تاني.');throw e;}finally{clearTimeout(timer);}
}

async function busy(form,resultId,working,fn){
 if(form.getAttribute('aria-busy')==='true')return;const target=$('#'+resultId,form);const submitter=$('[type=submit]',form);const set=s=>{if(target&&target.isConnected)target.textContent=s;};
 form.setAttribute('aria-busy','true');if(submitter)submitter.disabled=true;set(working);
 try{await fn(set);}catch(e){set(e instanceof Error?e.message:'في حاجة وقفت العملية. جرّب تاني.');}finally{if(form.isConnected){form.removeAttribute('aria-busy');if(submitter)submitter.disabled=false;}}
}

 'routine-maker':routineResult,

 plates:f=>{const total=bound(f.kg,20,700);let remainder=(total-20)/2;const parts=[];for(const kg of [25,20,15,10,5,2.5,1.25]){const count=Math.floor((remainder+1e-7)/kg);if(count){parts.push(`${count} × ${nfmt(kg,2)} كجم`);remainder-=kg*count;}}formResult('#plates-result',(parts.length?`لكل ناحية: ${parts.join(' + ')}.`:'مفيش أطباق متاحة تتركّب للوزن ده.')+(remainder>.001?` أقرب وزن أقل: ${nfmt(total-remainder*2,2)} كجم.`:''));},
 checkin:f=>{if(!gate()||!validDay(f.date)||f.date>today())return;const old=state.measurements.find(m=>m.date===f.date);const entry={date:f.date,weight:bound(f.weight,35,300),...Object.fromEntries(sizeFields.map(([k])=>[k,f[k]===''?(old?.[k]??null):bound(f[k],10,300)]))};state.measurements=[...state.measurements.filter(m=>m.date!==f.date),entry].sort((a,b)=>a.date.localeCompare(b.date));const latest=state.measurements.at(-1).date===f.date;if(latest)state.profile.weight=entry.weight;saved(latest?'القياسات اتحفظت والهدف اتحدّث':'القياس اتضاف للسجل',true);},
 review:f=>{if(!gate())return;const r={date:today(),energy:pick(f.energy,['low','mid','high'],'mid'),commit:pick(f.commit,['low','mid','high'],'mid'),pain:pick(f.pain,['none','mild','severe'],'none'),sleep:pick(f.sleep,['poor','okay','good'],'okay')};state.reviews=[...state.reviews.filter(x=>x.date!==r.date),r];saved('المراجعة اتحفظت',true);openDialog('مراجعة الأسبوع',reviewMarkup(r),'review-result');},
 journal:f=>{if(!gate())return;editDay().journal=txt(f.journal,800);saved('المفكّرة اتحفظت على جهازك',true);},
 'sleep-debt':f=>{const match=/^(\d{2}):(\d{2})$/.exec(f.wake||'');if(!match)return;const wake=+match[1]*60 + +match[2], bed=(wake-8*60-15+1440)%1440;formResult('#bedtime',`جرّب تدخل السرير حوالي ${clockString(bed)} عشان تدي لنفسك 8 ساعات وربع قبل معاد الصحيان.`);},
 'progress-photo':(f,ds,form)=>{if(!gate()||!validDay(f.date)||f.date>today())return;return busy(form,'local-photo-status','بنحضّر الصورة للحفظ…',async()=>{const src=await encodePhoto(f.image,620,.68);if(!form.isConnected)return;if(src.length>=300000)throw Error('الصورة لسه كبيرة. جرّب نسخة أصغر.');if(state.photos.length>=6)throw Error('وصلت لـ6 صور. امسح واحدة من تقدّمي الأول.');state.photos.push({id:id(),date:f.date,src});saved('الصورة اتحفظت محليًا',true);});},
 ai:(f,ds,form)=>{if(!gate()||!own(AI_ACTIONS,ds.value)||f.consent!=='on')return;return busy(form,'ai-output','بنجهّز الملخص…',async set=>{const answer=await askAI({mode:ds.value,context:aiContext(ui.aiExtra),question:txt(f.question,700)});set(answer);});},
 'friend-code':f=>{const name=txt(f.name,30);if(!name){toast('اكتب اسم مستعار.',true);return;}$('#friend-code-area').hidden=false;$('#friend-output').value=makeFriendCode(name);},
 'friend-import':f=>{try{const a=decodeFriendCode(f.code);state.friends=[...state.friends.filter(x=>x.name!==a.name),a].slice(-30);saved('الرمز اتضاف للمقارنة',true);}catch(e){toast(e.message,true);}}
};
document.addEventListener('click',e=>{
 const node=e.target instanceof Element?e.target.closest('button[data-act]'):null;if(!node||node.disabled)return;
 const act=node.dataset.act;if(!own(clicks,act))return;
 try{const result=clicks[act](node.dataset);if(result?.catch)result.catch(()=>toast('مقدرناش نكمّل الطلب دلوقتي.',true));}catch(error){console.error(error);toast('حصلت مشكلة. جرّب تاني.',true);}
});
document.addEventListener('submit',e=>{const form=e.target;if(!(form instanceof HTMLFormElement)||!form.dataset.form)return;e.preventDefault();const action=form.dataset.form;if(!own(forms,action))return;
 try{const f=Object.fromEntries(new FormData(form));const result=forms[action](f,form.dataset,form);if(result?.catch)result.catch(()=>toast('مقدرناش نكمّل الطلب دلوقتي.',true));}catch(error){console.error(error);toast('حصلت مشكلة. راجع البيانات وجرّب تاني.',true);}
});
document.addEventListener('input',e=>{
 const el=e.target;if(!(el instanceof HTMLInputElement||el instanceof HTMLTextAreaElement))return;
 if(el.matches('[data-food-query], [data-food-picker] [name=grams]'))foodInput(el);
 if(el.matches('[data-fav-grams]')){ui.favoriteGrams=el.value;favoritePreview();}
 if(el.matches('[data-form=photo-save] [name=grams]'))adjustPhotoGrams(el);
});
document.addEventListener('change',e=>{
 const el=e.target;if(!(el instanceof HTMLInputElement||el instanceof HTMLSelectElement))return;
 if(el.matches('[data-food-select]'))foodInput(el);
 if(el.matches('[data-food-picker] [name=meal]')&&own(MEALS,el.value))ui.meal=el.value;
 if(el.matches('[data-fav-select]')){ui.favoritePick=el.value;ui.favoriteGrams=getFood(el.value)?.portion||'';$('[data-fav-grams]').value=ui.favoriteGrams;favoritePreview();}
 const type=el.dataset.change;
 if(type==='food-date'&&validDay(el.value)&&el.value<=today()){ui.date=el.value;render();}
 if(type==='split'&&own(ROUTINE_NAMES,el.value)){const mode=el.value;if(!state.profile){render();gate();return;}state.settings.split=mode;ui.workday=0;saved('نظام التمرين اتغير');}
 if(type==='plan-choice'&&planSlots.includes(el.dataset.meal)){const v=toNum(el.value,-1);if(!state.profile){render();gate();return;}if([0,1,2].includes(v)){state.planChoices[ui.planDay+'-'+el.dataset.meal]=v;saved('البديل اتثبت');}}
 if(type==='strength'){ui.lift=el.value;render();}
 if(type==='caffeine-type'){const item=CAFFEINE.find(x=>x[0]===el.value);if(item&&el.form)el.form.elements.mg.value=item[2];}
});
$('#dialog').addEventListener('close',()=>{if(!$('#dialog').open)ui.modal='';});
window.addEventListener('hashchange',()=>{const tab=location.hash.slice(1);if(TABS.some(x=>x[0]===tab)&&ui.tab!==tab)go(tab,false);else if(!tab&&ui.tab!=='today')go('today',false);});
window.addEventListener('popstate',()=>{const tab=location.hash.slice(1)||'today';if(tab!==ui.tab&&TABS.some(x=>x[0]===tab))go(tab,false);});
let lastDate=today(),lastCheckNotice='';
setInterval(()=>{
 updateTimers();
 if(today()!==lastDate&&!$('#dialog').open){if(ui.date===lastDate)ui.date=today();lastDate=today();render();}
 if(!state.profile||!state.settings.reminders||document.visibilityState!=='visible')return;
 const h=new Date().getHours();if(h>=10&&h<21&&Date.now()-ui.lastReminder>2*3600_000&&getDay().water<energy().water){ui.lastReminder=Date.now();sendReminder('خد لك شوية ماية وسجّلها لو حابب.');}
 if(h>=10&&h<21&&nextCheck()<=today()&&lastCheckNotice!==today()){lastCheckNotice=today();sendReminder('جه معاد تسجيل الوزن والقياسات.');}
},500);
render();

})();
</script>
</body>
</html>
